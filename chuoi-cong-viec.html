<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFP · Góp ý chuỗi công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="chung.css">
</head>
<body class="trang-chuoi">

<header class="dau">
  <div class="dau-tren">
    <span class="ma-vt">TD-A07 · TD-A08 · TD-A09</span>
  </div>
</header>

<section class="noi" id="eChuoi"></section>

<div id="tip" hidden></div>
<div id="hopO" hidden>
  <span class="tip-nhan" id="hopONhan"></span>
  <textarea id="hopOTa" rows="5" aria-label="Nội dung đề xuất"></textarea>
  <div class="hopO-nut">
    <button id="hopOXoa" class="nguy">Xoá</button>
    <span class="hopO-goi">Esc huỷ · ⌘/Ctrl + Enter lưu</span>
    <button id="hopOHuy">Huỷ</button>
    <button class="pri" id="hopOLuu">Lưu</button>
  </div>
</div>

<script src="chung.js"></script>
<script>
// Trang này chỉ làm một việc: góp ý chuỗi công việc. Mô tả công việc nằm ở
// mo-ta-cong-viec.html, và index.html là trang cổng dẫn vào cả hai. Mỗi bên
// một địa chỉ riêng để gửi link cho team là gửi đúng thứ họ cần, không bắt
// họ vào rồi tự tìm tab.

let CHI_MUC = [];

/* ---------- tab CHUỖI CÔNG VIỆC ----------
   Một bảng phẳng: mỗi dòng là một nhiệm vụ, cột là bốn tầng của chuỗi.
   Chỉ tầng nhiệm vụ có dữ liệu (TD-A07 qua hồ sơ vị trí). Đầu việc TD-A08
   và việc cụ thể TD-A09 còn RỖNG trong nguồn — để trống chứ không bịa ra,
   và đó chính là chỗ team điền vào. Mọi ô đều sửa được: sửa xong gom lại
   thành một góp ý gửi đi, dữ liệu gốc không đụng tới.                    */

// Bộ lọc là ô xổ chọn, không phải thẻ bấm-tắt-bật: chọn một giá trị thì rõ mình
// đang xem gì. "*" nghĩa là không lọc.
//
// Mảng việc = 14 mục tiêu công ty, nạp từ du-lieu/muc-tieu.json. Nguồn duy nhất
// là cột "Mục tiêu" của TD-A07, sinh ra bằng cong/sinh-jd.py — đừng gõ tay vào đây.
// Năm nhóm chức danh được góp ý qua bảng chuỗi. "Medical marketing" không chỉ
// đúng một vị trí nên lấy cả ba cấp của phòng đó.
const CHUC_DANH_CHO = [
  "VT-18-S02",   // HPS  · Nhân viên Staff HPS
  "VT-18-L01",   // HPM  · Trưởng nhóm Lead HPM
  "VT-18-H01",   // Trưởng đơn vị Head of Detailing - ETC
  "VT-07-S01",   // Nhân viên Kế toán bán hàng
  "VT-17-H01",   // Trưởng đơn vị Head of Medical Marketing
  "VT-17-L01",   // Trưởng nhóm Medical Marketing Manager
  "VT-17-S01"    // Nhân viên Medical Marketing Executive
];

// Bảng gộp cả bảy chức danh chứ không mỗi lúc một chức danh: chọn mảng việc là
// thấy hết đơn vị nào, vị trí nào cũng đang gánh mục tiêu đó. Nạp một lần rồi giữ.
let DONG = null, loiNapDong = null;

// Bộ lọc bậc thang. "*" = không lọc. Ô sau chỉ liệt kê thứ còn với tới được sau
// khi các ô kia đã lọc, nên không bao giờ chọn ra một bảng rỗng.
const LOC = { donVi: "*", viTri: "*", rid: "*", vaiTro: "*" };
const TRUONG = [
  { k: "donVi",   id: "xoDonVi",    nhan: "Đơn vị",    dv: "đơn vị" },
  { k: "viTri",   id: "xoViTri",    nhan: "Vị trí",    dv: "cấp" },
  { k: "rid",     id: "xoChucDanh", nhan: "Chức danh", dv: "chức danh" },
  { k: "vaiTro",  id: "xoVaiTro",   nhan: "Vai trò",   dv: "vai trò" }
];

// Ô đã sửa nhưng chưa gửi. Khoá = mã chức danh | số thứ tự nhiệm vụ | tên cột.
let oSua = new Map();
const khoaO = (rid, k, cot) => `${rid}|${k}|${cot}`;

// Bảng trắng ở cuối: chỗ đề nghị những thứ chưa có trong dữ liệu. Giữ riêng một
// kho, vì ô ở đây không gắn với dòng nào trong DONG — không có "bản hiện tại" để
// mà so, cũng không có mã chức danh để tra ngược.
let oMoi = new Map();
const khoaMoi = (i, cot) => `${i}|${cot}`;

// Gửi xong thì ô vẫn đỏ và vẫn sửa được — người góp ý còn đang làm, chưa xong
// việc. Nên phải nhớ ô nào đã gửi rồi: lần gửi sau chỉ ghi phần đổi từ lần trước,
// không ghi lại cả mớ. Sửa lại một ô đã gửi thì nó rời khỏi đây, tính là mới.
let daGuiSua = new Set(), daGuiMoi = new Set();
let commitCuoi = "";

const chuaGuiSua = () => [...oSua.entries()].filter(([k]) => !daGuiSua.has(k));
const chuaGuiMoi = () => [...oMoi.entries()].filter(([k]) => !daGuiMoi.has(k));
const demDongChuaGui = () => new Set(chuaGuiMoi().map(([k]) => +k.split("|")[0])).size;
const SO_DONG_DAU = 3;
let soDongMoi = SO_DONG_DAU;
// Đếm dòng đã có chữ, để biết còn chừa sẵn dòng trống nào không.
const demDongMoi = () => new Set([...oMoi.keys()].map(k => +k.split("|")[0])).size;

const KHOA_EMAIL = "afp-cong-email";
const KHOA_NHAP  = "afp-cong-gopy-chuoi";

// Lưu ở giao diện là xong: nội dung đã sửa nằm lại trong máy người góp ý cho tới
// khi họ bấm Gửi hoặc Bỏ hết. Không có nó thì tải lại trang, đóng tab, hay máy
// tự ngủ là mất sạch — mà bảng này có 93 dòng, ai điền được nửa buổi rồi mất thì
// không bao giờ quay lại điền lần hai.
//
// Chỉ nằm trong máy họ, không đi đâu cả: localStorage là của riêng từng trình
// duyệt. Ban Điều hành không thấy gì cho tới khi họ bấm Gửi.
function luuNhap() {
  try {
    localStorage.setItem(KHOA_NHAP, JSON.stringify({
      v: 1, luc: Date.now(),
      oSua: [...oSua.entries()],
      oMoi: [...oMoi.entries()],
      daGuiSua: [...daGuiSua],
      daGuiMoi: [...daGuiMoi],
      commitCuoi,
      soDongMoi
    }));
  } catch {}
}

function docNhap() {
  let d;
  try { d = JSON.parse(localStorage.getItem(KHOA_NHAP) || "null"); } catch { return; }
  // Đọc lại thứ do bản cũ ghi ra mà đổ cả trang thì tệ hơn là mất bản nháp.
  if (!d || d.v !== 1) return;
  try {
    (d.oSua || []).forEach(([k, v]) => oSua.set(k, v));
    (d.oMoi || []).forEach(([k, v]) => oMoi.set(k, v));
    (d.daGuiSua || []).forEach(k => daGuiSua.add(k));
    (d.daGuiMoi || []).forEach(k => daGuiMoi.add(k));
    commitCuoi = d.commitCuoi || "";
    if (d.soDongMoi > soDongMoi) soDongMoi = d.soDongMoi;
  } catch { oSua.clear(); oMoi.clear(); daGuiSua.clear(); daGuiMoi.clear(); }
}

function xoaNhap() { try { localStorage.removeItem(KHOA_NHAP); } catch {} }
const HAU_TO = "@alpha-france.com";
let email = "";
try { email = localStorage.getItem(KHOA_EMAIL) || ""; } catch {}
const emailHopLe = (v) => new RegExp("^[^\\s@]+" + HAU_TO.replace(".", "\\.") + "$", "i").test((v || "").trim());

async function napDong() {
  if (DONG) return;
  const ds = CHI_MUC.filter(x => CHUC_DANH_CHO.includes(x.ma));
  try {
    const hs = await Promise.all(ds.map(async x => {
      const r = await fetch("du-lieu/jd/" + x.ma + ".json?v=" + Date.now());
      if (!r.ok) throw new Error(x.ma + ": HTTP " + r.status);
      return [x, await r.json()];
    }));
    DONG = [];
    hs.forEach(([x, d]) => {
      ((d.chuoi && d.chuoi.list) || []).forEach((n, k) => DONG.push({
        rid: x.ma, ten: x.ten, donVi: x.phong, viTri: x.cap, vaiTro: x.vai_tro || "",
        k, mt: (n.p || "").trim() || "(chưa gắn mục tiêu)", nv: n.n || "",
        // Một nhiệm vụ có thể mang nhiều đầu việc, mỗi đầu việc nhiều việc cụ
        // thể. Bảng vẫn một dòng một nhiệm vụ, nên nối bằng xuống dòng — ô cắt
        // ở ba dòng, bấm vào xem đủ.
        dv: (n.dv || []).join("\n"), vc: (n.vc || []).join("\n"),
        u: n.u || "", q: n.q || ""
      }));
    });
  } catch (e) {
    DONG = [];
    loiNapDong = e.message;
  }
}

// Một dòng khớp bộ lọc, có thể bỏ qua vài trường — dùng để tính danh sách chọn
// cho chính trường đó: nếu tự lọc chính mình thì ô xổ chỉ còn đúng giá trị đang chọn.
function khop(r, boQua) {
  for (const t of TRUONG) {
    if (t.k === boQua || LOC[t.k] === "*") continue;
    if (r[t.k] !== LOC[t.k]) return false;
  }
  return true;
}

const nhanTruong = (k, v) => k === "rid" ? `${v} · ${(DONG.find(r => r.rid === v) || {}).ten || ""}` : v;

async function veChuoi() {
  await napDong();

  if (loiNapDong) {
    $("eChuoi").innerHTML = `<div class="trong"><b>Lỗi nạp dữ liệu.</b> ${esc(loiNapDong)}. ` +
      `Kiểm tra thư mục <code>du-lieu/jd/</code> đã lên máy chủ chưa.</div>`;
    return;
  }

  // Giá trị nào không còn với tới được thì bỏ khỏi bộ lọc, đừng để treo một lựa
  // chọn cho ra bảng rỗng mà người dùng không hiểu vì sao.
  const chon = {};
  TRUONG.forEach(t => {
    const co = [...new Set(DONG.filter(r => khop(r, t.k)).map(r => r[t.k]))].filter(Boolean).sort();
    if (LOC[t.k] !== "*" && !co.includes(LOC[t.k])) LOC[t.k] = "*";
    chon[t.k] = co;
  });

  const hang = `<div class="hang-loc">` + TRUONG.map(t =>
    xoHtml(t.id, t.nhan,
      [{ v: "*", t: `Tất cả — ${chon[t.k].length} ${t.dv}` }]
        .concat(chon[t.k].map(v => ({ v, t: nhanTruong(t.k, v) }))),
      LOC[t.k], LOC[t.k] === "*")).join("") + `</div>`;

  const dsDong = DONG.filter(r => khop(r, null));

  const dau = `<div class="dau-bang"><h3>Góp ý chuỗi công việc</h3>` +
    `<span class="dem-bang">${dsDong.length} nhiệm vụ · ` +
    `${new Set(dsDong.map(r => r.rid)).size} chức danh</span></div>`;

  const oEmail = `<div class="hang-email">
    <label for="oEmail">Email Alpha France của bạn <b class="bat-buoc">bắt buộc</b></label>
    <input id="oEmail" type="email" inputmode="email" autocomplete="email" spellcheck="false"
           placeholder="ten${HAU_TO}" value="${esc(email)}">
    <span class="email-nhac" id="oEmailNhac">Góp ý gửi đi mang địa chỉ này — không có thì Ban Điều hành không biết hỏi lại ai.</span>
  </div>`;

  $("eChuoi").innerHTML = dau + hang + oEmail + `<div id="eThanhSua">${thanhSua()}</div>` +
    (dsDong.length ? veBang(dsDong)
      : `<div class="trong"><b>Không nhiệm vụ nào khớp bộ lọc.</b> Đổi một ô xổ chọn ở trên về "Tất cả".</div>`) +
    veBangMoi();
  dongTip(); dongSua();
  ganCat($("eChuoi"));
}

const xoHtml = (id, nhan, ds, dangChon, tat) =>
  `<div class="o-loc"><label for="${id}">${esc(nhan)}</label>` +
  `<select id="${id}" class="${tat ? "tat" : ""}">` +
  ds.map(o => `<option value="${esc(o.v)}"${o.v === dangChon ? " selected" : ""}>${esc(o.t)}</option>`).join("") +
  `</select></div>`;

// Thanh gom các ô đã sửa. Chỉ hiện khi có sửa — treo một thanh rỗng chỉ tổ chiếm chỗ.
function thanhSua() {
  const cSua = chuaGuiSua().length, cMoi = demDongChuaGui();

  // Còn thứ chưa gửi → thanh đỏ kèm nút Gửi.
  if (cSua || cMoi) {
    const phan = [];
    if (cSua) phan.push(`${cSua} ô chưa gửi`);
    if (cMoi) phan.push(`${cMoi} dòng đề nghị chưa gửi`);
    return `<div class="thanh-sua"><b>${phan.join(" · ")}</b>` +
      `<span>đã lưu trong máy bạn, chưa gửi đi đâu — soát lại rồi bấm Gửi</span>` +
      `<button id="nBoSua">Bỏ hết</button>` +
      `<button class="pri" id="nGuiSua">Gửi góp ý</button></div>`;
  }

  // Gửi hết rồi nhưng vẫn còn ô đỏ trên bảng → cảm ơn, và vẫn cho sửa tiếp.
  if (daGuiSua.size || daGuiMoi.size) {
    return `<div class="thanh-sua thanh-xong"><b class="bao-ok">Cảm ơn bạn đã góp ý.</b>` +
      `<span>Sửa tiếp ô nào cũng được — lần gửi sau chỉ ghi phần mới.</span>` +
      (commitCuoi ? `<a class="lien-nho" href="${commitCuoi}" target="_blank" rel="noopener">xem commit</a>` : "") +
      `<button id="nThuBanSao">✉ Gửi bản sao vào email của bạn</button>` +
      `<button id="nBoSua">Dọn bảng</button></div>`;
  }

  return "";
}

const COT_BANG = ["Chức danh", "Mục tiêu", "Nhiệm vụ", "Đầu việc", "Việc cụ thể", "Đơn vị đo", "Quy trình"];

function veBang(ds) {
  // Mục tiêu là một cột bình thường, đứng ngay trước Nhiệm vụ. Trước đây nó gộp
  // bằng rowspan rồi bằng dòng tiêu đề nhóm — cả hai đều bắt người đọc ngước lên
  // tìm xem dòng này thuộc mục tiêu nào. Lặp lại ở mỗi dòng thì tốn chỗ hơn một
  // chút, đổi lại đọc ngang một dòng là đủ hiểu, và lọc kiểu gì cũng không sai.
  //
  // Vẫn xếp theo mục tiêu trước để các dòng cùng mục tiêu nằm liền nhau.
  const sx = [...ds].sort((a, b) =>
    a.mt.localeCompare(b.mt) || a.rid.localeCompare(b.rid) || a.k - b.k);

  const o = (r, cot, goc, lop) =>
    `<td class="${lop}" data-nhan="${esc(cot)}">${oSuaHtml(r, cot, goc)}</td>`;

  const than = sx.map(r =>
    `<tr>` +
    `<td class="o-cd" data-nhan="Chức danh"><div class="cd-ten">${esc(r.rid)}</div>` +
    `<div class="cd-phu">${esc(r.donVi)} · ${esc(r.viTri)}</div></td>` +
    // Mục tiêu chỉ đọc: đổi mục tiêu của một nhiệm vụ là xếp lại chỗ đứng của nó
    // trong chuỗi, không phải sửa câu chữ — việc đó nên làm ở TD-A07, không phải
    // gõ tay vào đây rồi mỗi người viết một kiểu.
    `<td class="o-mt" data-nhan="Mục tiêu">${oXem(r.mt)}</td>` +
    o(r, "Nhiệm vụ",    r.nv, "o-nv") +
    o(r, "Đầu việc",    r.dv, "") +
    o(r, "Việc cụ thể", r.vc, "") +
    o(r, "Đơn vị đo",   r.u,  "o-dvi") +
    o(r, "Quy trình",   r.q,  "o-qt") +
    `</tr>`).join("");

  return `<div class="khung-bang"><table class="bang-chuoi"><thead><tr>` +
    COT_BANG.map(c => `<th>${esc(c)}</th>`).join("") +
    `</tr></thead><tbody>${than}</tbody></table></div>`;
}

const COT_MOI = ["Chức danh", "Mục tiêu", "Nhiệm vụ", "Đầu việc", "Việc cụ thể", "Đơn vị đo", "Quy trình"];

// Luôn hiện, dù bộ lọc đang chọn gì. Bộ lọc chỉ thu hẹp thứ ĐÃ CÓ; còn thứ chưa
// có thì không bộ lọc nào tìm ra được, nên chỗ đề nghị phải nằm ngoài bộ lọc.
function oThemHtml(i, cot) {
  const kh = khoaMoi(i, cot);
  const v = oMoi.get(kh);
  return `<div class="o-dai o-sua o-them${v ? " da-sua" : ""}" data-moi="${esc(kh)}" ` +
         `title="Bấm để điền">${v ? esc(v) : '<span class="trong-o">—</span>'}</div>`;
}

const dongThemHtml = (i) =>
  `<tr>` + COT_MOI.map(cot => `<td data-nhan="${esc(cot)}">${oThemHtml(i, cot)}</td>`).join("") + `</tr>`;

function veBangMoi() {
  let than = "";
  for (let i = 0; i < soDongMoi; i++) than += dongThemHtml(i);

  return `<div class="dau-bang dau-them"><h3>Đề nghị thêm các mục tiêu, nhiệm vụ, đầu việc, việc cụ thể chưa có</h3>` +
    `<span class="dem-bang" id="eDemThem">${demDongMoi()}/${soDongMoi} dòng đã điền</span></div>` +
    `<p class="dan-them">Bảng này không lọc theo gì cả — thứ chưa có trong dữ liệu thì không bộ lọc nào ` +
    `tìm ra. Điền được ô nào thì điền, không bắt buộc đủ bảy cột.</p>` +
    `<div class="khung-bang khung-them"><table class="bang-chuoi"><thead><tr>` +
    COT_MOI.map(c => `<th>${esc(c)}</th>`).join("") +
    `</tr></thead><tbody>${than}</tbody></table></div>` +
    `<div class="hang-them"><button id="nThemDong">+ Thêm dòng trống</button></div>`;
}

const oXem = (chu) => `<div class="o-dai">${esc(chu)}</div>`;

function oSuaHtml(r, cot, goc) {
  const kh = khoaO(r.rid, r.k, cot);
  const s = oSua.get(kh);
  const lop = "o-dai o-sua" + (s ? (s.xoa ? " da-xoa" : " da-sua") : "");
  const than = s
    ? (s.xoa ? `<s>${esc(goc)}</s> <span class="the-xoa">đề xuất xoá</span>` : esc(s.moi))
    : (goc ? esc(goc) : '<span class="trong-o">chưa có</span>');
  return `<div class="${lop}" data-o="${esc(kh)}" data-goc="${esc(goc)}" title="Bấm để sửa">${than}</div>`;
}

function ganCat(goc) {
  goc.querySelectorAll(".o-dai").forEach(el => {
    el.classList.toggle("cat", el.scrollHeight - el.clientHeight > 1);
  });
}

/* ---------- hộp nổi cạnh ô ---------- */
// Dùng chung một hàm đặt chỗ cho cả hộp xem và hộp sửa: hai hộp lệch nhau vài
// pixel là nhìn ra ngay, mà sửa hai chỗ thì sớm muộn cũng quên một chỗ.
function datCanhO(t, el) {
  t.hidden = false;
  t.style.left = "-9999px";
  t.style.top = "0px";
  const r = t.getBoundingClientRect();
  const o = el.getBoundingClientRect();
  let y = o.bottom + 6;
  if (y + r.height + 8 > innerHeight) y = o.top - r.height - 6;
  y = Math.max(8, Math.min(y, innerHeight - r.height - 8));
  const x = Math.max(8, Math.min(o.left, innerWidth - r.width - 8));
  t.style.left = (x + scrollX) + "px";
  t.style.top  = (y + scrollY) + "px";
}

function moTip(el) {
  const t = $("tip");
  t.innerHTML = `<span class="tip-nhan">Nội dung đầy đủ</span>${esc(el.textContent)}`;
  datCanhO(t, el);
  t.__o = el;
}
function dongTip() { $("tip").hidden = true; $("tip").__o = null; }

/* ---------- hộp sửa một ô ---------- */
function moSuaO(el) {
  dongTip();
  const them = !!el.dataset.moi;
  const [a, b] = (el.dataset.moi || el.dataset.o).split("|").slice(them ? 0 : 1);
  const cot = them ? b : (el.dataset.o.split("|")[2]);
  $("hopONhan").textContent = them ? `${cot} · dòng đề nghị ${(+a) + 1}` : `${cot} · dòng ${(+a) + 1}`;
  $("hopOTa").value = them
    ? (oMoi.get(el.dataset.moi) || "")
    : ((oSua.get(el.dataset.o) || {}).xoa ? el.dataset.goc : ((oSua.get(el.dataset.o) || {}).moi ?? el.dataset.goc));
  // Ô vốn đã trống thì không có gì để xoá — để nút bấm được chỉ tổ gửi đi một
  // đề xuất rỗng, người duyệt đọc không hiểu muốn gì. Ở bảng trắng thì Xoá nghĩa
  // là bỏ chữ vừa gõ, nên bật khi ô đang có chữ.
  $("hopOXoa").disabled = them ? !oMoi.get(el.dataset.moi) : !el.dataset.goc;
  datCanhO($("hopO"), el);
  $("hopO").__o = el;
  $("hopOTa").focus();
  $("hopOTa").setSelectionRange($("hopOTa").value.length, $("hopOTa").value.length);
}
function dongSua() { $("hopO").hidden = true; $("hopO").__o = null; }

// Lưu một ô thì CHỈ vẽ lại đúng ô đó, không vẽ lại cả bảng. Vẽ lại cả bảng thì
// màn hình nhảy, mất chỗ đang đọc, và người đang góp ý liên tiếp mấy ô cạnh nhau
// phải tìm lại vị trí sau mỗi lần Lưu.
function ghiO(xoa) {
  const el = $("hopO").__o;
  if (!el) return;
  const them = !!el.dataset.moi;
  const kh = el.dataset.moi || el.dataset.o;
  const moi = $("hopOTa").value.trim();
  let themDong = false;

  if (them) {
    // Bảng trắng: gõ rỗng hoặc bấm Xoá đều là bỏ ô đó đi, không giữ chuỗi rỗng.
    daGuiMoi.delete(kh);
    if (xoa || !moi) oMoi.delete(kh);
    else oMoi.set(kh, moi);
    // Điền tới dòng cuối thì chừa sẵn một dòng trống nữa, khỏi phải bấm Thêm dòng.
    if (!xoa && moi && +kh.split("|")[0] === soDongMoi - 1) { soDongMoi++; themDong = true; }
  } else {
    const goc = el.dataset.goc;
    const [rid, k, cot] = kh.split("|");
    daGuiSua.delete(kh);
    // Sửa về đúng bản gốc thì gỡ khỏi danh sách, đừng đếm nó là một ô đã sửa.
    if (!xoa && moi === goc) oSua.delete(kh);
    else oSua.set(kh, { rid, k: +k, cot, cu: goc, moi: xoa ? "" : moi, xoa: !!xoa });
  }

  luuNhap();
  dongSua();
  veLaiO(el, them, kh, themDong);
}

// Thay đúng một ô, rồi cập nhật hai con số đếm. Không đụng gì khác trên trang.
function veLaiO(el, them, kh, themDong) {
  const oCha = el.parentElement;
  // Lần sửa đầu tiên làm thanh gom hiện ra, đẩy cả bảng tụt xuống — đo chỗ ô
  // đang sửa trước và sau, rồi bù lại đúng phần lệch.
  const truoc = oCha.getBoundingClientRect().top;

  if (them) {
    const [i, cot] = kh.split("|");
    oCha.innerHTML = oThemHtml(+i, cot);
  } else {
    const [rid, k, cot] = kh.split("|");
    const r = DONG.find(x => x.rid === rid && x.k === +k);
    if (r) oCha.innerHTML = oSuaHtml(r, cot, el.dataset.goc);
  }
  ganCat(oCha);

  // Thanh gom nằm trong một khung có id cố định nên thay nội dung là xong —
  // không phải chèn hay xoá phần tử, tức không làm trang co giãn thất thường.
  if ($("eThanhSua")) $("eThanhSua").innerHTML = thanhSua();

  const dem = $("eDemThem");
  if (dem) dem.textContent = `${demDongMoi()}/${soDongMoi} dòng đã điền`;

  if (themDong) {
    const tbody = document.querySelector(".khung-them tbody");
    if (tbody) {
      tbody.insertAdjacentHTML("beforeend", dongThemHtml(soDongMoi - 1));
      ganCat(tbody.lastElementChild);
    }
  }

  const lech = oCha.getBoundingClientRect().top - truoc;
  if (Math.abs(lech) > 1) scrollBy(0, lech);
}

$("hopOLuu").onclick = () => ghiO(false);
$("hopOXoa").onclick = () => ghiO(true);
$("hopOHuy").onclick = dongSua;
$("hopOTa").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.stopPropagation(); dongSua(); }
  // Ctrl/Cmd+Enter lưu — gõ nhiều dòng mà Enter lưu luôn thì không xuống dòng được.
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ghiO(false);
});

addEventListener("resize", () => { dongTip(); dongSua(); });
$("tip").addEventListener("dblclick", dongTip);
$("tip").addEventListener("mouseleave", (e) => {
  if (!e.relatedTarget || !$("tip").__o || !$("tip").__o.contains(e.relatedTarget)) dongTip();
});
// Bấm ra ngoài hộp sửa mà chưa Lưu = Huỷ, đúng như skill bảng ô dài quy định.
document.addEventListener("mousedown", (e) => {
  if ($("hopO").hidden) return;
  if ($("hopO").contains(e.target) || ($("hopO").__o && $("hopO").__o.contains(e.target))) return;
  dongSua();
});

/* ---------- gửi cả loạt ô đã sửa ---------- */
// Các dòng đề nghị thêm, gom theo số dòng, bỏ dòng nào chưa điền gì.
function gomTheoDong(cap) {
  const theo = new Map();
  for (const [kh, v] of cap) {
    const [i, cot] = kh.split("|");
    if (!theo.has(i)) theo.set(i, {});
    theo.get(i)[cot] = v;
  }
  return [...theo.entries()].sort((a, b) => +a[0] - +b[0]).map(([, o]) => o);
}

const dongDeNghi = () => gomTheoDong([...oMoi.entries()]);

function thanDeNghiThem() {
  const ds = dongDeNghi();
  if (!ds.length) return "";
  const trich = (v) => (v || "_(chưa điền)_").replace(/\|/g, "\\|").replace(/\n/g, "<br>");
  return `\n---\n\n## Đề nghị thêm mới\n\n` +
    ds.map((o, i) => `### Dòng đề nghị ${i + 1}\n\n| | |\n|---|---|\n` +
      COT_MOI.map(c => `| ${c} | ${trich(o[c])} |`).join("\n") + "\n").join("\n");
}

function thanGopYGop() {
  const ds = [...oSua.values()].sort((a, b) =>
    a.rid.localeCompare(b.rid) || a.k - b.k || a.cot.localeCompare(b.cot));
  const trich = (v) => (v || "_(trống)_").replace(/\|/g, "\\|").replace(/\n/g, "<br>");

  const dau = `| | |\n|---|---|\n| Người góp ý | ${email} |\n` +
    `| Số ô sửa | ${ds.length} |\n| Số dòng đề nghị thêm | ${demDongMoi()} |\n\n---\n\n`;

  return dau + (ds.length ? "## Sửa nội dung đã có\n\n" : "") +
    ds.map((o, i) => {
      const r = DONG.find(x => x.rid === o.rid && x.k === o.k) || {};
      return `### ${i + 1}. ${o.cot} — ${o.rid} dòng ${o.k + 1}\n\n` +
             `| | |\n|---|---|\n| Chức danh | ${r.ten || o.rid} |\n` +
             `| Đơn vị · Vị trí · Vai trò | ${r.donVi || "—"} · ${r.viTri || "—"} · ${r.vaiTro || "—"} |\n` +
             `| Mục tiêu | ${r.mt || "—"} |\n| Nhiệm vụ | ${trich(r.nv)} |\n\n` +
             `| Bản hiện tại | Đề xuất |\n|---|---|\n| ${trich(o.cu)} | ` +
             `${o.xoa ? "**xoá nội dung này**" : trich(o.moi)} |\n`;
    }).join("\n") + thanDeNghiThem();
}

async function guiGopYGop() {
  if (!oSua.size && !oMoi.size) return;
  if (!emailHopLe(email)) {
    const o = $("oEmail");
    $("oEmailNhac").textContent = `Cần một địa chỉ ${HAU_TO} hợp lệ mới gửi được.`;
    $("oEmailNhac").classList.add("loi");
    if (o) { o.classList.add("loi"); o.focus(); }
    return;
  }

  const phan = [];
  if (oSua.size) phan.push(`${oSua.size} ô sửa`);
  if (oMoi.size) phan.push(`${demDongMoi()} dòng thêm mới`);
  const tieuDe = `TD-A07 · ${phan.join(" · ")} — ${email}`;
  const than = thanGopYGop();

  // Có Worker thì ghi thẳng vào GitHub: nhân viên bấm Gửi là xong, không đăng
  // nhập, không mở tab nào. Đây là đường chính; hai đường dưới là dự phòng.
  if (API_GOP_Y) {
    const nut = $("nGuiSua");
    if (nut) { nut.disabled = true; nut.textContent = "Đang ghi…"; }
    // Chỉ gửi phần đổi từ lần gửi trước. Gửi lại cả mớ thì lịch sử trên GitHub
    // đầy bản trùng, và người duyệt không biết lần này người ta sửa cái gì.
    const goiSua = chuaGuiSua();
    const goiMoi = chuaGuiMoi();
    try {
      const r = await fetch(API_GOP_Y, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email,
          sua: goiSua.map(([, o]) => ({ rid: o.rid, k: o.k, cot: o.cot, cu: o.cu, moi: o.moi, xoa: o.xoa })),
          them: gomTheoDong(goiMoi)
        })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.loi || ("HTTP " + r.status));

      // Không dọn bảng: người góp ý còn đang làm việc, ô vẫn đỏ và vẫn sửa được.
      // Chỉ đánh dấu những gì vừa gửi, để lần sau không gửi lại.
      goiSua.forEach(([k]) => daGuiSua.add(k));
      goiMoi.forEach(([k]) => daGuiMoi.add(k));
      commitCuoi = j.url || "";
      luuNhap();
      $("eThanhSua").innerHTML = thanhSua();
      return;
    } catch (e) {
      if (nut) { nut.disabled = false; nut.textContent = "Gửi góp ý"; }
      return baoGui("Không ghi được: " + esc(e.message), true);
    }
  }

  if (!CO_API) {
    const { cat } = moFormIssue("TD-A07", tieuDe, than);
    return baoGui(cat
      ? "Nội dung dài nên form chỉ điền được một phần — phần còn lại đã chép vào bộ nhớ tạm, dán nốt rồi bấm Create."
      : "Đã mở sẵn form trên GitHub — soát lại rồi bấm Create. Ban Điều hành sẽ duyệt.");
  }
  try {
    const r = await fetch("/api/gop-y", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tuDien: "TD-A07", rid: [...new Set([...oSua.values()].map(o => o.rid))].join(", "),
                             cot: "Chuỗi công việc", noiDung: than })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.loi || ("HTTP " + r.status));
    baoGui(`Đã mở Issue #${j.issue} — <a href="${j.url}" target="_blank" rel="noopener">xem trên GitHub</a>.`);
  } catch (e) {
    baoGui("Không gửi được: " + esc(e.message), true);
  }
}

/* ---------- bản sao gửi vào hộp thư người góp ý ---------- */
// Trang tĩnh không tự gửi thư được: không có máy chủ, mà nhét khoá dịch vụ mail
// vào file HTML công khai thì ai xem mã nguồn cũng gửi thư nhân danh công ty
// được. Nên dựng sẵn nội dung rồi mở ứng dụng mail của chính người góp ý — họ
// bấm Gửi, thư đi từ hộp thư của họ, và họ giữ được bản sao trong Sent.
//
// Thân thư để chữ thường, không markdown: nó vào hộp thư chứ không vào GitHub.
const NGUONG_MAILTO = 1800;   // vượt ngưỡng này nhiều ứng dụng mail cắt mất đuôi

function thanThuBanSao() {
  const d = new Date();
  const ngay = `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
  const L = [`Góp ý chuỗi công việc — soạn ngày ${ngay}`, `Người góp ý: ${email}`, ""];

  if (oSua.size) {
    const ds = [...oSua.values()].sort((a, b) =>
      a.rid.localeCompare(b.rid) || a.k - b.k || a.cot.localeCompare(b.cot));
    L.push(`SỬA NỘI DUNG ĐÃ CÓ — ${ds.length} ô`, "");
    ds.forEach((o, i) => {
      const r = DONG.find(x => x.rid === o.rid && x.k === o.k) || {};
      L.push(`${i + 1}. ${o.rid} · dòng ${o.k + 1} · ${o.cot}`);
      if (r.mt) L.push(`   Mục tiêu : ${r.mt}`);
      if (r.nv) L.push(`   Nhiệm vụ : ${r.nv}`);
      L.push(`   Hiện tại : ${o.cu || "(trống)"}`);
      L.push(`   Đề xuất  : ${o.xoa ? "XOÁ nội dung này" : o.moi}`, "");
    });
  }

  if (oMoi.size) {
    const theo = new Map();
    for (const [kh, v] of oMoi) {
      const [i, cot] = kh.split("|");
      if (!theo.has(i)) theo.set(i, {});
      theo.get(i)[cot] = v;
    }
    L.push(`ĐỀ NGHỊ THÊM MỚI — ${theo.size} dòng`, "");
    [...theo.entries()].sort((a, b) => +a[0] - +b[0]).forEach(([, o], i) => {
      L.push(`${i + 1}.`);
      COT_MOI.forEach(c => { if (o[c]) L.push(`   ${c} : ${o[c]}`); });
      L.push("");
    });
  }

  L.push("---",
    "Thư này chỉ là bản sao để bạn giữ. Bản chính thức là Issue trên GitHub:",
    `https://github.com/${REPO_CONG}/issues`,
    "Ban Điều hành duyệt Issue rồi mới vào dữ liệu thật.");
  return L.join("\n");
}

function moThuBanSao() {
  if (!emailHopLe(email)) return;
  let than = thanThuBanSao();
  const dat = (t) => `mailto:${encodeURIComponent(email)}` +
    `?subject=${encodeURIComponent("Bản sao góp ý chuỗi công việc — " + email)}` +
    `&body=${encodeURIComponent(t)}`;
  // Thư quá dài thì nhiều ứng dụng mail cắt cụt mà không báo. Cắt chủ động và
  // nói rõ còn thiếu, hơn là để người nhận tưởng mình gửi thiếu.
  if (dat(than).length > NGUONG_MAILTO * 3) {
    const duoi = "\n\n… danh sách còn dài. Xem đủ ở Issue trên GitHub.";
    while (than.length > 300 && dat(than + duoi).length > NGUONG_MAILTO * 3) {
      than = than.slice(0, Math.floor(than.length * 0.8));
    }
    than += duoi;
  }
  location.href = dat(than);
}

function baoGui(chu, loi) {
  const t = $("eChuoi").querySelector(".thanh-sua");
  if (!t) return;
  // Lỗi thì phải để lại nút Gửi. Trước đây thanh báo lỗi chỉ còn "Bỏ hết", tức
  // cách duy nhất thoát khỏi một lần mạng hỏng là xoá hết công sức vừa gõ.
  t.innerHTML = `<b class="${loi ? "bao-loi" : "bao-ok"}">${chu}</b>` +
    (loi ? "" : `<button id="nThuBanSao">✉ Gửi bản sao vào email của bạn</button>`) +
    `<button id="nBoSua">${loi ? "Bỏ hết" : "Xong — dọn bảng"}</button>` +
    (loi ? `<button class="pri" id="nGuiSua">Gửi lại</button>` : "");
}

$("eChuoi").addEventListener("change", (e) => {
  const t = TRUONG.find(x => x.id === e.target.id);
  if (!t) return;
  LOC[t.k] = e.target.value;

});

// Gõ email thì nhớ lại cho lần sau, khỏi phải gõ mỗi lần vào trang. Không vẽ lại
// bảng ở đây — vẽ lại là ô nhập mất tiêu điểm ngay giữa lúc đang gõ.
$("eChuoi").addEventListener("input", (e) => {
  if (e.target.id !== "oEmail") return;
  email = e.target.value.trim();
  try { localStorage.setItem(KHOA_EMAIL, email); } catch {}
  const ok = emailHopLe(email);
  e.target.classList.toggle("loi", !!email && !ok);
  const n = $("oEmailNhac");
  n.classList.toggle("loi", !!email && !ok);
  n.textContent = !email || ok
    ? "Góp ý gửi đi mang địa chỉ này — không có thì Ban Điều hành không biết hỏi lại ai."
    : `Phải là địa chỉ ${HAU_TO}.`;
});

$("eChuoi").addEventListener("click", (e) => {
  if (e.target.id === "nGuiSua")    return guiGopYGop();
  if (e.target.id === "nThuBanSao") return moThuBanSao();
  if (e.target.id === "nThemDong")  { soDongMoi++; return veChuoi(); }
  if (e.target.id === "nBoSua")     {
    oSua.clear(); oMoi.clear(); daGuiSua.clear(); daGuiMoi.clear();
    commitCuoi = ""; soDongMoi = SO_DONG_DAU; xoaNhap(); return veChuoi();
  }

  // Ô sửa được thì bấm vào là soạn, kể cả ô đang trống — chỗ trống chính là chỗ
  // cần điền. Ô chỉ đọc thì chỉ mở xem, mà chỉ khi nội dung bị cắt bớt.
  const os = e.target.closest(".o-sua");
  if (os) return os === $("hopO").__o ? dongSua() : moSuaO(os);


  const o = e.target.closest(".o-dai.cat");
  if (o) return o === $("tip").__o ? dongTip() : moTip(o);
  dongTip();
});

// Rời chuột khỏi ô mà không sang hộp thì đóng, đúng như skill bảng ô dài quy định.
$("eChuoi").addEventListener("mouseout", (e) => {
  const o = e.target.closest(".o-dai");
  if (!o || o !== $("tip").__o) return;
  const sang = e.relatedTarget;
  if (sang && ($("tip").contains(sang) || o.contains(sang))) return;
  dongTip();
});
</script>
</body>
</html>
